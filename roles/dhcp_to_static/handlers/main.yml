---
- name: Apply the netplan configuration
  ansible.builtin.command:
    cmd: netplan apply

- name: Restart the network (ifupdown)
  ansible.builtin.systemd:
    name: networking
    state: restarted

- name: Restart dhcpcd
  ansible.builtin.systemd:
    name: dhcpcd
    state: restarted

- name: Activate the static NetworkManager connections
  ansible.builtin.shell:
    cmd: "nmcli connection reload && nmcli connection up rushwilt-{{ item }}"
  loop: "{{ dhcp_to_static_by_backend.networkmanager | default([]) }}"

- name: Restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted
