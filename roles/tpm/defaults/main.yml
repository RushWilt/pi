---
# Firmware settings that bring the SPI TPM 2.0 module online.  The
# overlay name must exist in the running kernel's device-tree overlay
# tree (checked in tasks/detect.yml); on the current Raspberry Pi
# kernels that is tpm-slb9670, which drives the Infineon SLB 967x SPI
# chips through the kernel's tpm_tis_spi driver.
rushwilt_tpm_dtparam: spi=on
rushwilt_tpm_dtoverlay: tpm-slb9670

# Userspace package that provides the tpm2_* commands.
rushwilt_tpm_packages:
  - tpm2-tools

# Fail the play when this board is expected to carry a TPM module but
# no TPM answers on /dev/tpm0 once the configuration is in place.
# Boards that simply do not have a module fitted are reported instead.

# Reboot the board in place when the firmware configuration was just
# applied: schedule the reboot, wait for the board to come back on its
# address, then continue the play with the verification.  The board must
# keep that address across the reboot (the dhcp_to_static role, earlier in
# the play, takes care of it); when a leased interface still holds a
# dynamic lease with a gateway, the role falls back to reporting the
# pending reboot instead.
rushwilt_tpm_auto_reboot: true
rushwilt_tpm_fail_if_absent: false
